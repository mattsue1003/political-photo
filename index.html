<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>猜猜他是誰？台灣政治人物懷舊猜謎</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF4F2; --paper:#FFFFFF; --ink:#12343B; --ink-soft:#4A6168;
  --teal:#028090; --teal-soft:#D5ECEC; --orange:#E8552D; --amber:#F4A93C;
  --amber-soft:#FDF0D8; --ok:#2E8B57; --line:#C9DAD7; --shadow:0 10px 30px rgba(18,52,59,.14);
  --sans:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  --serif:"Noto Serif TC","PMingLiU","Songti TC",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F2428; --paper:#183539; --ink:#F1F6F5; --ink-soft:#B6CACA;
    --teal:#4CC3CF; --teal-soft:#1E4A50; --orange:#FF7A55; --amber:#F7BC5E;
    --amber-soft:#3A3220; --ok:#5ECF8F; --line:#2E5258; --shadow:0 10px 30px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0F2428; --paper:#183539; --ink:#F1F6F5; --ink-soft:#B6CACA;
  --teal:#4CC3CF; --teal-soft:#1E4A50; --orange:#FF7A55; --amber:#F7BC5E;
  --amber-soft:#3A3220; --ok:#5ECF8F; --line:#2E5258; --shadow:0 10px 30px rgba(0,0,0,.4);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:22px;line-height:1.55;
  background-image:radial-gradient(var(--line) 1.2px,transparent 1.2px);background-size:26px 26px}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:4px solid var(--amber);outline-offset:3px}

/* top bar */
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px clamp(14px,3vw,36px);
  background:var(--teal);color:#fff}
.bar h1{font-family:var(--serif);font-weight:900;font-size:clamp(1.3rem,2.6vw,1.9rem);margin:0;letter-spacing:.04em;flex:1;min-width:220px}
.progress{font-size:1.15rem;font-weight:700;background:rgba(255,255,255,.18);padding:4px 16px;border-radius:999px;white-space:nowrap}
.tool{background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.5);color:#fff;border-radius:12px;
  padding:6px 14px;font-size:1rem;font-weight:700}
.tool:hover{background:rgba(255,255,255,.28)}

/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(18px,3vw,44px);
  padding:clamp(16px,3vw,40px);max-width:1500px;margin:0 auto;align-items:start}
@media (max-width:860px){.stage{grid-template-columns:1fr}}

/* old album photo */
.album{position:relative;background:var(--paper);padding:clamp(14px,2vw,26px);box-shadow:var(--shadow);
  transform:rotate(-1.2deg);border-radius:4px}
.album .q{font-family:var(--serif);font-weight:900;font-size:clamp(1.6rem,3.4vw,2.6rem);text-align:center;margin:0 0 12px;color:var(--orange);letter-spacing:.06em}
.frame{position:relative;aspect-ratio:4/5;background:#DCE5E3;overflow:hidden;border-radius:2px}
.frame img{width:100%;height:100%;object-fit:cover;object-position:center 22%;display:block;transition:filter .5s}
.corner{position:absolute;width:44px;height:44px;background:var(--ink);z-index:2;opacity:.88}
.corner.tl{top:-2px;left:-2px;clip-path:polygon(0 0,100% 0,0 100%)}
.corner.tr{top:-2px;right:-2px;clip-path:polygon(0 0,100% 0,100% 100%)}
.corner.bl{bottom:-2px;left:-2px;clip-path:polygon(0 0,0 100%,100% 100%)}
.corner.br{bottom:-2px;right:-2px;clip-path:polygon(100% 0,100% 100%,0 100%)}
.nophoto{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  color:#5d7479;text-align:center;padding:20px}
.nophoto svg{width:55%;max-width:260px}
.nophoto p{margin:0;font-size:1rem;font-weight:700}
.nophoto button{margin-top:4px;background:var(--teal);color:#fff;border:0;border-radius:12px;padding:8px 18px;font-size:1rem;font-weight:700}

/* hints */
.panel{display:flex;flex-direction:column;gap:14px}
.hint{display:grid;grid-template-columns:62px 1fr;align-items:stretch;background:var(--paper);border-radius:16px;
  box-shadow:var(--shadow);overflow:hidden;min-height:92px;border:3px solid transparent}
.hint .num{display:flex;align-items:center;justify-content:center;background:var(--teal-soft);color:var(--teal);
  font-family:var(--serif);font-weight:900;font-size:2rem}
.hint .body{padding:12px 18px;display:flex;flex-direction:column;justify-content:center}
.hint .lab{font-size:.95rem;font-weight:700;color:var(--ink-soft)}
.hint .txt{font-size:clamp(1.35rem,2.3vw,1.8rem);font-weight:700;line-height:1.4}
.hint.locked .txt{color:var(--ink-soft);opacity:.5;font-weight:500}
.hint.open{border-color:var(--amber);animation:pop .45s ease}
.hint.open .num{background:var(--amber);color:var(--ink)}
.hint .big{font-family:var(--serif);font-size:3rem;color:var(--orange);line-height:1}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:scale(1)}}

.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.opt{border:3px solid var(--teal);background:var(--paper);border-radius:14px;padding:10px 6px;
  font-family:var(--serif);font-weight:900;font-size:clamp(1.3rem,2.4vw,1.9rem)}
.opt:hover{background:var(--teal-soft)}
.opt.right{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{opacity:.35;text-decoration:line-through;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@media (max-width:520px){.opts{grid-template-columns:1fr}}

.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px}
.btn{border:0;border-radius:16px;padding:14px 26px;font-size:clamp(1.25rem,2.2vw,1.6rem);font-weight:900;box-shadow:var(--shadow);flex:1;min-width:180px}
.btn.hintb{background:var(--amber);color:#12343B}
.btn.reveal{background:var(--orange);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.navrow{display:flex;gap:12px}
.nav{flex:1;background:var(--paper);border:3px solid var(--line);border-radius:14px;padding:10px;font-size:1.2rem;font-weight:700}

/* reveal */
.overlay{position:fixed;inset:0;background:rgba(10,30,34,.6);display:none;align-items:center;justify-content:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
.overlay.show{display:flex}
.card{background:var(--paper);border-radius:22px;max-width:1080px;width:100%;max-height:100%;overflow:auto;
  display:grid;grid-template-columns:300px 1fr;box-shadow:0 30px 60px rgba(0,0,0,.35);animation:rise .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes rise{from{transform:translateY(40px) scale(.95);opacity:0}to{transform:none;opacity:1}}
.card .ph{background:var(--teal);padding:22px;display:flex;flex-direction:column;align-items:center;gap:10px}
.card .ph .mini{width:100%;aspect-ratio:4/5;background:#DCE5E3;overflow:hidden;border:8px solid #fff}
.card .ph img{width:100%;height:100%;object-fit:cover;object-position:center 22%}
.card .ph a{color:#fff;font-size:.85rem}
.card .info{padding:clamp(18px,3vw,36px)}
.card .name{font-family:var(--serif);font-weight:900;font-size:clamp(2.6rem,6vw,4.4rem);line-height:1.1;margin:0;letter-spacing:.08em}
.card .meta{font-size:1.15rem;color:var(--ink-soft);font-weight:700;margin:6px 0 16px}
.card .meta span{display:inline-block;background:var(--teal-soft);color:var(--ink);padding:2px 12px;border-radius:999px;margin:4px 6px 0 0}
.points{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:8px}
.points li{font-size:clamp(1.25rem,2.2vw,1.6rem);font-weight:700;padding:8px 14px 8px 18px;border-left:8px solid var(--amber);background:var(--amber-soft);border-radius:0 12px 12px 0}
.talk{border:3px dashed var(--teal);border-radius:16px;padding:12px 18px;font-size:clamp(1.2rem,2vw,1.5rem);font-weight:700}
.talk b{color:var(--teal);display:block;font-size:1rem}
.card .row{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}
.card .row .btn{min-width:150px}
.btn.next{background:var(--teal);color:#fff}
.btn.close{background:var(--line);color:var(--ink)}
@media (max-width:760px){.card{grid-template-columns:1fr}.card .ph .mini{max-width:200px}}

/* photo manager */
.mgr{background:var(--paper);border-radius:20px;max-width:1100px;width:100%;max-height:100%;overflow:auto;padding:clamp(16px,3vw,30px)}
.mgr h2{font-family:var(--serif);margin:0 0 6px;font-size:1.8rem}
.mgr p{margin:0 0 14px;font-size:1.05rem;color:var(--ink-soft)}
.mgr .top{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.item{border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.item .th{aspect-ratio:4/5;background:#DCE5E3;border-radius:8px;overflow:hidden;margin-bottom:6px;display:flex;align-items:center;justify-content:center;color:#5d7479;font-size:2.4rem;font-weight:900}
.item .th img{width:100%;height:100%;object-fit:cover;object-position:center 22%}
.item .nm{font-weight:900;font-size:1.15rem}
.item .src{font-size:.85rem;color:var(--ink-soft)}
.item .b{display:flex;gap:6px;justify-content:center;margin-top:6px}
.sm{border:2px solid var(--teal);background:transparent;color:var(--teal);border-radius:10px;padding:4px 10px;font-size:.95rem;font-weight:700}
.sm.fill{background:var(--teal);color:#fff}
.hidden{display:none!important}

/* start */
.start .box{background:var(--paper);border-radius:24px;padding:clamp(22px,4vw,48px);max-width:720px;text-align:center;box-shadow:0 30px 60px rgba(0,0,0,.35)}
.start h2{font-family:var(--serif);font-weight:900;font-size:clamp(2rem,5vw,3.2rem);margin:0 0 10px;color:var(--teal)}
.start p{font-size:1.25rem;margin:0 0 20px}
.start .opts2{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="bar">
  <h1>猜猜他是誰？台灣政治人物懷舊猜謎</h1>
  <span class="progress" id="progress">第 1 / 20 位</span>
  <button class="tool" id="btnPhotos">照片管理</button>
  <button class="tool" id="btnSound">音效：開</button>
  <button class="tool" id="btnTheme">深色</button>
</header>

<main class="stage">
  <section class="album" aria-label="人物照片">
    <p class="q">猜猜他是誰？</p>
    <div class="frame" id="frame">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <img id="photo" alt="待猜人物照片" class="hidden">
      <div class="nophoto" id="nophoto">
        <svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="72" r="42" fill="#9DB2B0"/><path d="M28 190c6-48 36-70 72-70s66 22 72 70z" fill="#9DB2B0"/><text x="100" y="88" text-anchor="middle" font-size="58" font-weight="900" fill="#fff" font-family="serif">?</text></svg>
        <p id="nophotoMsg">這一位還沒有照片</p>
        <button id="quickUpload">上傳這位的照片</button>
      </div>
    </div>
  </section>

  <section class="panel" aria-live="polite">
    <div class="hint locked" id="h1"><div class="num">1</div><div class="body"><span class="lab">第一個特徵</span><span class="txt">按「給提示」打開</span></div></div>
    <div class="hint locked" id="h2"><div class="num">2</div><div class="body"><span class="lab">第二個特色</span><span class="txt">還沒打開</span></div></div>
    <div class="hint locked" id="h3"><div class="num">3</div><div class="body"><span class="lab">名字的第一個字</span><span class="txt">還沒打開</span></div></div>
    <div class="hint locked" id="h4"><div class="num">4</div><div class="body"><span class="lab">三選一</span><span class="txt">還沒打開</span><div class="opts hidden" id="opts"></div></div></div>
    <div class="actions">
      <button class="btn hintb" id="btnHint">給提示</button>
      <button class="btn reveal" id="btnReveal">公布答案</button>
    </div>
    <div class="navrow">
      <button class="nav" id="btnPrev">上一位</button>
      <button class="nav" id="btnNext">下一位</button>
    </div>
  </section>
</main>

<!-- start -->
<div class="overlay start show" id="start">
  <div class="box">
    <h2>猜猜他是誰？</h2>
    <p>收錄 1985 到 2010 年代的 20 位台灣政治人物。看照片猜猜看，猜不出來就按「給提示」，一共有 4 個提示。</p>
    <div class="opts2">
      <button class="btn reveal" id="startShuffle">隨機順序開始</button>
      <button class="btn next" id="startOrder">依年代順序開始</button>
    </div>
  </div>
</div>

<!-- reveal -->
<div class="overlay" id="reveal" role="dialog" aria-modal="true" aria-label="答案">
  <div class="card">
    <div class="ph"><div class="mini"><img id="rPhoto" alt=""></div><a id="rSrc" target="_blank" rel="noopener" class="hidden">照片來源：維基百科</a></div>
    <div class="info">
      <h2 class="name" id="rName"></h2>
      <div class="meta" id="rMeta"></div>
      <ul class="points" id="rPoints"></ul>
      <div class="talk" id="rTalk"></div>
      <div class="row">
        <button class="btn close" id="rClose">回到照片</button>
        <button class="btn next" id="rNext">下一位</button>
      </div>
    </div>
  </div>
</div>

<!-- photo manager -->
<div class="overlay" id="mgr" role="dialog" aria-modal="true" aria-label="照片管理">
  <div class="mgr">
    <h2>照片管理</h2>
    <p>上傳的照片只存在這台裝置的瀏覽器裡。批次上傳時，檔名包含人名就會自動對應，例如「李登輝.jpg」。沒有上傳時，若網路允許會自動從維基百科帶入照片。</p>
    <div class="top">
      <button class="sm fill" id="batchBtn">批次上傳（依檔名對應）</button>
      <button class="sm" id="clearAll">清除全部上傳照片</button>
      <button class="sm" id="mgrClose">完成</button>
    </div>
    <div class="grid" id="mgrGrid"></div>
  </div>
</div>

<input type="file" accept="image/*" id="fileOne" class="hidden">
<input type="file" accept="image/*" id="fileBatch" multiple class="hidden">
<canvas id="fx"></canvas>

const WIKI = {jck:"蔣經國",ldh:"李登輝",hbc:"郝柏村",lyg:"林洋港",lc:"連戰",scy:"宋楚瑜",wjp:"王金平",wbx:"吳伯雄",myj:"馬英九",hzq:"胡志強",zsk:"趙少康",hxj:"黃信介",ycyy:"余陳月瑛",xxl:"許信良",csb:"陳水扁",lxl:"呂秀蓮",xct:"謝長廷",szc:"蘇貞昌",yxk:"游錫堃",cj:"陳菊"};

const $ = id => document.getElementById(id);
let order = PEOPLE.map((_,i)=>i), cur = 0, level = 0, options = [], soundOn = true;
const wikiImg = {};

/* ---------- storage ---------- */
const KEY = "pg_photo_";
function getPhoto(id){ try{ return localStorage.getItem(KEY+id); }catch(e){ return null; } }
function setPhoto(id,data){ try{ localStorage.setItem(KEY+id,data); return true; }catch(e){ alert("照片太多存不下了，請先移除部分照片再試。"); return false; } }
function delPhoto(id){ try{ localStorage.removeItem(KEY+id); }catch(e){} }

function shrink(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = () => { const im = new Image(); im.onload = () => {
        const max = 800, s = Math.min(1, max/Math.max(im.width,im.height));
        const c = document.createElement("canvas"); c.width = Math.round(im.width*s); c.height = Math.round(im.height*s);
        c.getContext("2d").drawImage(im,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",.82)); };
      im.onerror = rej; im.src = r.result; };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

/* ---------- wikipedia photo (works when hosted where network is allowed) ---------- */
let wikiAll = null;
/* 英文維基標題：中文條目抓不到照片時改用 */
const WIKI_EN = {jck:"Chiang Ching-kuo",ldh:"Lee Teng-hui",hbc:"Hau Pei-tsun",lyg:"Lin Yang-kang",lc:"Lien Chan",scy:"James Soong",wjp:"Wang Jin-pyng",wbx:"Wu Po-hsiung",myj:"Ma Ying-jeou",hzq:"Jason Hu",zsk:"Jaw Shaw-kong",hxj:"Huang Hsin-chieh",ycyy:"Yu Chen Yueh-ying",xxl:"Hsu Hsin-liang",csb:"Chen Shui-bian",lxl:"Annette Lu",xct:"Frank Hsieh",szc:"Su Tseng-chang",yxk:"Yu Shyi-kun",cj:"Chen Chu"};
/* 中文同名條目（如消歧義頁）的替代標題 */
const WIKI_ALT = {hzq:["胡志強 (政治人物)","胡志强 (政治人物)"]};
/* 想指定照片時，可在這裡貼圖片網址，優先使用 */
const PHOTO_URL = {
  ycyy:"https://upload.wikimedia.org/wikipedia/zh/5/5b/%E4%BD%99%E9%99%B3%E6%9C%88%E7%91%9B.jpg"
};

async function pageImages(host, titlesById){
  const out = {}, list = [...new Set(Object.values(titlesById).flat())];
  if (!list.length) return out;
  const url = "https://"+host+"/w/api.php?action=query&format=json&origin=*&prop=pageimages|pageprops&piprop=thumbnail"
    + "&pithumbsize=600&ppprop=disambiguation&redirects=1&converttitles=1&titles=" + encodeURIComponent(list.join("|"));
  try{
    const j = await (await fetch(url)).json(), q = j.query || {}, map = {};
    [...(q.normalized||[]),...(q.converted||[]),...(q.redirects||[])].forEach(x=>map[x.from]=x.to);
    const final = t => { let n=0; while(map[t] && n++<5) t = map[t]; return t; };
    const pages = {}; Object.values(q.pages||{}).forEach(pg=>pages[pg.title]=pg);
    for (const [id,ts] of Object.entries(titlesById)){
      for (const t of [].concat(ts)){
        const pg = pages[final(t)];
        if (pg && pg.thumbnail && !(pg.pageprops && "disambiguation" in pg.pageprops)){
          out[id] = { src: pg.thumbnail.source, page: "https://"+host+"/wiki/"+encodeURIComponent(final(t)) }; break; }
      }
    }
  }catch(e){}
  return out;
}
async function wikidataImages(ids){
  const out = {}; if (!ids.length) return out;
  const url = "https://www.wikidata.org/w/api.php?action=wbgetentities&format=json&origin=*&sites=enwiki&props=claims|sitelinks"
    + "&titles=" + encodeURIComponent(ids.map(id=>WIKI_EN[id]).join("|"));
  try{
    const j = await (await fetch(url)).json();
    Object.values(j.entities||{}).forEach(en=>{
      const t = en.sitelinks && en.sitelinks.enwiki && en.sitelinks.enwiki.title;
      const id = ids.find(i=>WIKI_EN[i]===t);
      const p18 = en.claims && en.claims.P18 && en.claims.P18[0].mainsnak.datavalue;
      if (id && p18) out[id] = { src: "https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(p18.value)+"?width=600",
        page: "https://commons.wikimedia.org/wiki/File:"+encodeURIComponent(p18.value) };
    });
  }catch(e){}
  return out;
}
function loadAllWiki(){
  if (wikiAll) return wikiAll;
  wikiAll = (async () => {
    for (const id in WIKI) wikiImg[id] = PHOTO_URL[id] ? {src:PHOTO_URL[id], page:null} : null;
    const need = () => Object.keys(WIKI).filter(id=>!wikiImg[id]);
    const zhT = {}; need().forEach(id=>zhT[id] = [...(WIKI_ALT[id]||[]), WIKI[id]].filter(t=>!(WIKI_ALT[id] && t===WIKI[id])));
    Object.assign(wikiImg, await pageImages("zh.wikipedia.org", zhT));
    const enT = {}; need().forEach(id=>enT[id] = WIKI_EN[id]);
    Object.assign(wikiImg, await pageImages("en.wikipedia.org", enT));
    Object.assign(wikiImg, await wikidataImages(need()));
  })();
  return wikiAll;
}
async function fetchWiki(p){
  await loadAllWiki();
  return wikiImg[p.id] || null;
}
async function photoFor(p){
  const up = getPhoto(p.id); if (up) return {src:up, page:null};
  return await fetchWiki(p);
}

/* ---------- sound ---------- */
let ac = null;
function tone(freq,dur,type="sine",when=0,vol=.18){
  if (!soundOn) return; try{
  ac = ac || new (window.AudioContext||window.webkitAudioContext)();
  const t = ac.currentTime+when, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.02); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur+.05);}catch(e){}
}
const sfx = {
  hint(){ tone(660,.18,"triangle"); tone(990,.25,"triangle",.1); },
  right(){ [523,659,784,1047].forEach((f,i)=>tone(f,.35,"triangle",i*.11,.2)); },
  wrong(){ tone(220,.3,"sawtooth",0,.08); tone(180,.35,"sawtooth",.12,.08); },
  reveal(){ for(let i=0;i<8;i++) tone(140+i*12,.08,"square",i*.06,.05); [523,784,1047].forEach((f,i)=>tone(f,.5,"triangle",.5+i*.12,.2)); },
  page(){ tone(440,.12,"sine",0,.12); }
};

/* ---------- confetti ---------- */
const fx = $("fx"), cx = fx.getContext("2d"); let parts = [], raf = null;
function resize(){ fx.width = innerWidth; fx.height = innerHeight; } addEventListener("resize",resize); resize();
function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cols = ["#E8552D","#F4A93C","#028090","#2E8B57","#ffffff"];
  for(let i=0;i<140;i++) parts.push({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*16,vy:Math.random()*-14-4,r:Math.random()*8+5,c:cols[i%5],a:Math.random()*6,life:120});
  if (!raf) loop();
}
function loop(){
  cx.clearRect(0,0,fx.width,fx.height);
  parts.forEach(p=>{ p.vy+=.35; p.x+=p.vx; p.y+=p.vy; p.a+=.2; p.life--; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.a); cx.fillStyle=p.c; cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); cx.restore(); });
  parts = parts.filter(p=>p.life>0 && p.y<fx.height+20);
  raf = parts.length ? requestAnimationFrame(loop) : (cx.clearRect(0,0,fx.width,fx.height), null);
}

/* ---------- game ---------- */
const person = () => PEOPLE[order[cur]];
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

async function showPhoto(){
  const p = person(), img = $("photo");
  img.classList.add("hidden"); $("nophoto").classList.remove("hidden"); $("nophotoMsg").textContent = "照片載入中…";
  const ph = await photoFor(p);
  if (p !== person()) return;
  if (ph){ img.onload = () => { img.classList.remove("hidden"); $("nophoto").classList.add("hidden"); };
    img.onerror = () => { $("nophotoMsg").textContent = "照片載入失敗，可按下方上傳"; }; img.src = ph.src; }
  else $("nophotoMsg").textContent = "抓不到這一位的照片，可按下方上傳";
}

function render(){
  const p = person(); level = 0;
  $("progress").textContent = `第 ${cur+1} / ${order.length} 位`;
  ["h1","h2","h3","h4"].forEach(h=>{ const el=$(h); el.classList.remove("open"); el.classList.add("locked"); });
  $("h1").querySelector(".txt").textContent = "按「給提示」打開";
  ["h2","h3","h4"].forEach(h=>$(h).querySelector(".txt").textContent="還沒打開");
  $("h4").querySelector(".txt").classList.remove("hidden");
  $("opts").classList.add("hidden"); $("opts").innerHTML = "";
  let pool = PEOPLE.filter(x=>x!==p && x.g===p.g); if (pool.length<2) pool = PEOPLE.filter(x=>x!==p);
  options = shuffle([p, ...shuffle(pool).slice(0,2)]);
  $("btnHint").disabled = false; $("btnHint").textContent = "給提示（1/4）";
  $("btnPrev").disabled = cur===0;
  $("btnNext").textContent = cur===order.length-1 ? "再玩一輪" : "下一位";
  showPhoto();
}

function giveHint(){
  if (level>=4) return; level++; const p = person(), el = $("h"+level);
  el.classList.remove("locked"); el.classList.add("open");
  const t = el.querySelector(".txt");
  if (level===1) t.textContent = p.h1;
  if (level===2) t.textContent = p.h2;
  if (level===3) t.innerHTML = `名字的第一個字是 <span class="big">${p.name[0]}</span>`;
  if (level===4){ t.classList.add("hidden"); const box=$("opts"); box.classList.remove("hidden");
    options.forEach(o=>{ const b=document.createElement("button"); b.className="opt"; b.textContent=o.name;
      b.onclick=()=>pick(b,o); box.appendChild(b); }); }
  sfx.hint();
  $("btnHint").disabled = level>=4;
  $("btnHint").textContent = level>=4 ? "提示都打開了" : `給提示（${level+1}/4）`;
}

function pick(btn,o){
  if (btn.classList.contains("wrong")||btn.classList.contains("right")) return;
  if (o===person()){ btn.classList.add("right"); sfx.right(); confetti();
    document.querySelectorAll(".opt").forEach(b=>b.disabled=true); setTimeout(reveal,1300); }
  else { btn.classList.add("wrong"); sfx.wrong(); }
}

async function reveal(){
  const p = person();
  $("rName").textContent = p.name;
  $("rMeta").innerHTML = `<span>${p.years}</span><span>${p.party}</span>`;
  $("rPoints").innerHTML = p.pts.map(x=>`<li>${x}</li>`).join("");
  $("rTalk").innerHTML = `<b>和長輩聊聊</b>${p.talk}`;
  const ph = await photoFor(p), ri = $("rPhoto"), rs = $("rSrc");
  if (ph){ ri.src = ph.src; ri.alt = p.name; ri.classList.remove("hidden"); } else { ri.removeAttribute("src"); ri.classList.add("hidden"); }
  if (ph && ph.page){ rs.href = ph.page; rs.classList.remove("hidden"); } else rs.classList.add("hidden");
  $("rNext").textContent = cur===order.length-1 ? "再玩一輪" : "下一位";
  $("reveal").classList.add("show"); sfx.reveal(); confetti();
  $("rNext").focus();
}
function closeReveal(){ $("reveal").classList.remove("show"); }
function next(){ closeReveal(); if (cur<order.length-1) cur++; else { order = shuffle(order); cur = 0; } sfx.page(); render(); }
function prev(){ if (cur>0){ cur--; sfx.page(); render(); } }

/* ---------- photo manager ---------- */
let uploadTarget = null;
async function buildMgr(){
  const g = $("mgrGrid"); g.innerHTML = "";
  for (const p of PEOPLE){
    const up = getPhoto(p.id), d = document.createElement("div"); d.className = "item";
    d.innerHTML = `<div class="th">${up?`<img src="${up}" alt="${p.name}">`:"?"}</div><div class="nm">${p.name}</div>
      <div class="src">${up?"已上傳照片":"使用維基百科照片（若可連線）"}</div>
      <div class="b"><button class="sm fill" data-up="${p.id}">上傳</button>${up?`<button class="sm" data-del="${p.id}">移除</button>`:""}</div>`;
    g.appendChild(d);
    if (!up) fetchWiki(p).then(w=>{ if (w){ d.querySelector(".th").innerHTML = `<img src="${w.src}" alt="${p.name}">`; } });
  }
}
$("mgrGrid").addEventListener("click",e=>{
  const u = e.target.dataset.up, x = e.target.dataset.del;
  if (u){ uploadTarget = u; $("fileOne").click(); }
  if (x){ delPhoto(x); buildMgr(); if (person().id===x) showPhoto(); }
});
$("fileOne").addEventListener("change",async e=>{
  const f = e.target.files[0]; e.target.value = ""; if (!f||!uploadTarget) return;
  const data = await shrink(f); if (setPhoto(uploadTarget,data)){ if ($("mgr").classList.contains("show")) buildMgr(); if (person().id===uploadTarget) showPhoto(); }
});
$("fileBatch").addEventListener("change",async e=>{
  const files = [...e.target.files]; e.target.value = ""; let n = 0, miss = [];
  for (const f of files){ const p = PEOPLE.find(x=>f.name.includes(x.name));
    if (!p){ miss.push(f.name); continue; } if (setPhoto(p.id, await shrink(f))) n++; }
  buildMgr(); showPhoto();
  alert(`已對應 ${n} 張照片。` + (miss.length?`\n找不到對應人名的檔案：${miss.join("、")}`:""));
});
$("batchBtn").onclick = () => $("fileBatch").click();
$("clearAll").onclick = () => { if (confirm("確定清除所有上傳的照片嗎？")){ PEOPLE.forEach(p=>delPhoto(p.id)); buildMgr(); showPhoto(); } };
$("btnPhotos").onclick = () => { buildMgr(); $("mgr").classList.add("show"); };
$("mgrClose").onclick = () => $("mgr").classList.remove("show");
$("quickUpload").onclick = () => { uploadTarget = person().id; $("fileOne").click(); };

/* ---------- controls ---------- */
$("btnHint").onclick = giveHint;
$("btnReveal").onclick = reveal;
$("btnNext").onclick = next;
$("btnPrev").onclick = prev;
$("rClose").onclick = closeReveal;
$("rNext").onclick = next;
$("btnSound").onclick = () => { soundOn = !soundOn; $("btnSound").textContent = "音效：" + (soundOn?"開":"關"); };
function applyTheme(t){ document.documentElement.setAttribute("data-theme",t); $("btnTheme").textContent = t==="light"?"深色":"淺色"; try{localStorage.setItem("pg_theme",t);}catch(e){} }
$("btnTheme").onclick = () => applyTheme(document.documentElement.getAttribute("data-theme")==="light"?"dark":"light");
try{ const t = localStorage.getItem("pg_theme"); if (t) applyTheme(t); }catch(e){}
function begin(shuf){ order = shuf ? shuffle(PEOPLE.map((_,i)=>i)) : PEOPLE.map((_,i)=>i); cur = 0; $("start").classList.remove("show"); sfx.page(); render(); }
$("startShuffle").onclick = () => begin(true);
$("startOrder").onclick = () => begin(false);
document.querySelectorAll(".overlay").forEach(o=>o.addEventListener("click",e=>{ if (e.target===o && o.id!=="start") o.classList.remove("show"); }));
addEventListener("keydown",e=>{
  if ($("start").classList.contains("show") || $("mgr").classList.contains("show")) { if (e.key==="Escape") $("mgr").classList.remove("show"); return; }
  if (e.key===" "){ e.preventDefault(); if (!$("reveal").classList.contains("show")) giveHint(); }
  else if (e.key==="Enter" && !$("reveal").classList.contains("show") && document.activeElement.tagName!=="BUTTON"){ reveal(); }
  else if (e.key==="ArrowRight") next();
  else if (e.key==="ArrowLeft"){ closeReveal(); prev(); }
  else if (e.key==="Escape") closeReveal();
});
render();
</script>
